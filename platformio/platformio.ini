; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[platformio]
default_envs = seeed_xiao_esp32_c6_gavirate4

[common]
build_flags = '-Wall' 
	'-std=gnu++17'
	-D CORE_DEBUG_LEVEL=5
	-D LOG_TAG=\"epd-weather\"
	-D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
	-D CONFIG_LOG_VERSION=2
	-D CONFIG_LOG_COLORS_SUPPORT
	-D CONFIG_LOG_COLORS
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1  	

build_unflags = '-Werror' '-std=gnu++11' -D CONFIG_LOG_VERSION

[env]
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 80000000L
platform = espressif32 @ 6.13.0
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
board_build.partitions = huge_app.csv
lib_deps =
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit Unified Sensor @ 1.1.15
  bblanchon/ArduinoJson @ 7.4.3
  zinggjm/GxEPD2 @ 1.6.8

; ==============================================================================

; https://www.waveshare.com/wiki/ESP32-S3-Zero
[env:waveshare_esp32_s3zero]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = ${common.build_flags} 
	-D LOCAL_CONFIG_FILE=config/waveshare-esp32s3-zero.h
	-D LOCATION_CONFIG_FILE=config/locations/gavirate_4.cpp
build_unflags = ${common.build_unflags} 

; ==============================================================================

[env:waveshare_esp32_c6zero]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitm-1
build_flags =
	${common.build_flags}
	-D HAS_BUILTIN_LED
	-D LOCAL_CONFIG_FILE=config/waveshare-esp32-c6.h
	-D LOCATION_CONFIG_FILE=config/locations/gavirate_6.cpp	
build_unflags = ${common.build_unflags}


; ==============================================================================

; https://wiki.seeedstudio.com/xiao_esp32c6_with_platform_io/
; Using pioarduino/espressif32 which has proper ESP32-C6 support
[env:seeed_xiao_esp32_c6]
platform = https://github.com/pioarduino/platform-espressif32.git
board = seeed_xiao_esp32c6
build_flags =
	${common.build_flags}
	-D HAS_BUILTIN_LED
	-D LOCAL_CONFIG_FILE=config/seedstudio-esp32-c6.h
	-D LOCATION_CONFIG_FILE=config/locations/zurigo.cpp	
build_unflags = ${common.build_unflags}

; ==============================================================================

; https://wiki.seeedstudio.com/xiao_esp32c6_with_platform_io/
; Using pioarduino/espressif32 which has proper ESP32-C6 support
[env:seeed_xiao_esp32_c6_gavirate4]
platform = https://github.com/pioarduino/platform-espressif32.git
board = seeed_xiao_esp32c6
build_flags =
	${common.build_flags}
	-D HAS_BUILTIN_LED
	-D LOCAL_CONFIG_FILE=config/seedstudio-esp32-c6.h
	-D LOCATION_CONFIG_FILE=config/locations/zurigo.cpp	
build_unflags = ${common.build_unflags}

; ==============================================================================

[env:dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
build_flags =
	${common.build_flags}
	-D HAS_BUILTIN_LED
build_unflags = ${common.build_unflags}

; ==============================================================================

[env:firebeetle32]
board = firebeetle32
build_flags =
	${common.build_flags}
	-D HAS_BUILTIN_LED
build_unflags = ${common.build_unflags}

; ==============================================================================
; UNIT TESTS
;   pio test -e native       runs on the host, no board needed
;   pio test -e test_device  runs on the board (must be connected)
; Only the sources under test are built (build_src_filter), so main.cpp's
; setup()/loop() don't clash with the test runner's.

[test]
build_src_filter = -<*> +<api_response.cpp>

[env:native]
platform = native
framework =
lib_deps = bblanchon/ArduinoJson @ 7.4.3
extra_scripts = pre:test/native_shim/iquote_include_dir.py
test_build_src = yes
build_src_filter = ${test.build_src_filter}
build_unflags =
build_flags =
	-std=gnu++17
	-Wall
	-I test/native_shim
	-D LOCAL_CONFIG_FILE=native_config.h
	; required by config.h, only used by config.cpp which isn't built here
	-D LOCATION_CONFIG_FILE=unused
	-D ARDUINOJSON_ENABLE_ARDUINO_STREAM=1
	-D UNITY_SUPPORT_64
	-D OWM_FIXTURES_DIR=\"$PROJECT_TEST_DIR\"

; Extends the board you test on; change `extends` for a different board.
[env:test_device]
extends = env:seeed_xiao_esp32_c6
test_build_src = yes
build_src_filter = ${test.build_src_filter}
board_build.embed_txtfiles =
	test/owm_onecall.json
	test/air_pollution.json
build_flags =
	${env:seeed_xiao_esp32_c6.build_flags}
	-D UNITY_SUPPORT_64